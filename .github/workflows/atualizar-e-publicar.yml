name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 7 * * *"   # todos os dias, 07:17 UTC
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write   # commit do semanal.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Num push só se publica o que já está no repositório.
      # No agendamento e no arranque manual o script tem de correr bem; se falhar, o job
      # fica vermelho (recebes um email) e o site continua com os dados anteriores.
      - name: Descarregar dados
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python scripts/fetch_data.py

      - name: Guardar dados no repositório
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- site/dados/semanal.json; then
            echo "Sem dados novos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/dados/semanal.json
            git commit -m "Atualiza dados"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
